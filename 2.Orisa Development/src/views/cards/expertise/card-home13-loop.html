<article class="sec-5-home-13__card ">
    <div class="sec-5-home-13__card-media anim-zoomin">
        <img data-speed=".9" src="@@img" alt="orisa" loading="lazy" decoding="async">
    </div>
    <div class="sec-5-home-13__card-body">
        <header class="sec-5-home-13__card-head">
            <h3 class="sec-5-home-13__card-title mb-0 reveal-text">@@title</h3>
            <div class="sec-5-home-13__card-tag">
                <span class="sec-5-home-13__card-tag-text">@@tag</span>
                <button class="sec-5-home-13__card-toggle" type="button" aria-label="Open expertise details">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                        <path d="M9 3.75V14.25M3.75 9H14.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
            </div>
        </header>
        <p class="sec-5-home-13__card-text mb-0 at_fade_anim">@@text</p>
    </div>
</article>
