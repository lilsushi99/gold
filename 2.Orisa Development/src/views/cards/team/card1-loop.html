<div class="@@classList changeless">
    <div class="team-card">
        <div class="team-card-image">
            <div class="anim-zoomin">
                <img src="@@img" alt="@@name" class="img-cover">
            </div>
        </div>
        <a href="@@linkPost" class="team-card-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10" fill="none">
                <path d="M7.85986 2.43872L1.7123 8.58629L0.702148 7.57614L6.84971 1.42857H1.43131V0H9.28843V7.85714H7.85986V2.43872Z" fill="currentColor" />
            </svg>
        </a>
        <div class="team-card-content">
            <a href="@@linkPost" class="team-card-name">
                <h2 class="h6 fz-font-2xl">@@name</h2>
            </a>
            <p class="team-card-position fz-font-sm m-0 common-white">@@position</p>
        </div>
    </div>
</div>
