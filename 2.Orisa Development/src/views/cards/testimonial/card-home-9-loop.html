<div class="@@classList">
    <div class="testimonial-9-card">
        <div class="testimonial-img anim-zoomin-wrap">
            <img src="@@img" alt="orisa" class="anim-zoomin">
        </div>
        <div class="testimonial-content">
            <p class="testimonial-quote">"@@comment"</p>
            <div class="testimonial-author">
                <div class="author-logo">
                    <img src="@@logo" alt="orisa">
                </div>
                <div class="author-info">
                    <h6 class="author-name neutral-950 m-0 fw-600">@@name</h6>
                    <p class="author-position neutral-500 m-0 fw-500">@@position</p>
                </div>
            </div>
        </div>
    </div>
</div>
