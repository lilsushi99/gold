<div class="blog-card @@classList mb-30" data-category="@@category">
    <div class="blog-card__thumb hover-effect-1">
        <a href="@@linkPost" class="blog-card__img-link">
            <img src="@@img" class="blog-card__img22" alt="orisa">
        </a>
    </div>
    <div class="blog-card__content">
        <h2 class=" h6 blog-card__title">
            <a href="@@linkPost" class="blog-card__title-link">@@title</a>
        </h2>
        <p class="blog-card__meta">
            <span class="blog-card__meta-text">By </span>
            <a href="@@linkAuthor" class="blog-card__author">@@author</a>
            <span class="blog-card__meta-text"> – @@date</span>
        </p>
    </div>
</div>
