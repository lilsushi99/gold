<article class="blog-card-2 @@classList" data-category="@@category-filter">
    <div class="blog-card-2__left">
        <span class="blog-card-2__category">@@category</span>
        <h2 class="h6 blog-card-2__title fw-600">
            <a href="@@linkPost" class="blog-card-2__title-link">@@title</a>
        </h2>
    </div>
    <div class="blog-card-2__thumb hover-effect-1">
        <a href="@@linkPost" class="blog-card-2__img-link">
            <img src="@@img" class="blog-card-2__img" alt="@@title">
        </a>
    </div>
    <div class="blog-card-2__right">
        <p class="blog-card-2__excerpt">@@excerpt</p>
        <p class="blog-card-2__meta">
            <span class="blog-card-2__meta-text">By </span>
            <a href="@@linkAuthor" class="blog-card-2__author">@@author</a>
            <span class="blog-card-2__meta-text"> – @@date</span>
        </p>
    </div>
</article>
