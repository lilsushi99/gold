<article class="blog-card-3">
    <div class="blog-card-3__thumb hover-effect-1">
        <a href="@@linkPost" class="blog-card-3__img-link">
            <img src="@@img" class="blog-card-3__img" alt="@@title">
        </a>
    </div>
    <div class="blog-card-3__content">
        <h6 class="blog-card-3__title">
            <a href="@@linkPost" class="blog-card-3__title-link">@@title</a>
        </h6>
        <ul class="blog-card-3__meta ps-3">
            <li class="blog-card-3__meta-date"> @@date</li>
        </ul>
    </div>
</article>
