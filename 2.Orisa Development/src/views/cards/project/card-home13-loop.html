<article class="sec-3-home-13__card">
    <div class="sec-3-home-13__card-meta">
        <p class="sec-3-home-13__card-loc mb-0">@@loc</p>
        <h3 class="sec-3-home-13__card-title mb-0 reveal-text">@@title</h3>
        <a class="sec-3-home-13__card-link" href="@@link">
            <span>VIEW DETAILS</span>
            <span class="sec-3-home-13__card-link-dots" aria-hidden="true">&bull; &bull; &bull;</span>
        </a>
    </div>
    <a class="sec-3-home-13__card-media anim-zoomin-wrap" href="@@link">
        <img class="anim-zoomin" data-speed=".8" src="@@img" alt="orisa" loading="lazy" decoding="async">
    </a>
    <div class="sec-3-home-13__card-info">
        <p class="sec-3-home-13__card-desc mb-0">@@desc</p>
        <dl class="sec-3-home-13__card-specs mb-0">
            <div class="sec-3-home-13__card-row">
                <dt>CATEGORY</dt>
                <dd>@@category</dd>
            </div>
            <div class="sec-3-home-13__card-row">
                <dt>SIZE</dt>
                <dd>@@size</dd>
            </div>
            <div class="sec-3-home-13__card-row">
                <dt>SERVICE</dt>
                <dd>@@service</dd>
            </div>
        </dl>
    </div>
</article>
