<div class="product-card @@classList mb-30" data-category="@@category">
    <div class="product-card__inner">
        <div class="product-card__thumb hover-effect-1">
            <a href="@@link" class="product-card__img-link">
                <img src="@@img" class="product-card__img" alt="@@title">
            </a>
        </div>
        <div class="product-card__content">
            <p class="product-card__brand">@@brand</p>
            <div class="product-card__row">
                <h3 class="h6 product-card__title">
                    <a href="@@link" class="product-card__title-link @@titleClassList">@@title</a>
                </h3>
                <p class="product-card__price">@@price</p>
            </div>
        </div>
    </div>
</div>
