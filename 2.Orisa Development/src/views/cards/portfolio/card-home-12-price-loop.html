<div class="card-home-12-price @@modifier at_fade_anim" data-fade-from="bottom" data-delay="@@delay">
    <div class="card-home-12-price__top">
        @@badgeHtml
        <p class="card-home-12-price__plan">@@plan</p>
        <div class="card-home-12-price__price">
            <span class="card-home-12-price__amount">@@price</span>
            <span class="card-home-12-price__period">/monthly</span>
        </div>
        <p class="card-home-12-price__desc">@@desc</p>
        <a class="card-home-12-price__cta" href="@@link" aria-label="@@ctaLabel">
            <span class="card-home-12-price__cta-text">@@ctaLabel</span>
            <span class="card-home-12-price__cta-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="13" viewBox="0 0 14 13" fill="none">
                    <path d="M11.0037 3.41421L2.39712 12.0208L0.98291 10.6066L9.5895 2H2.00373V0H13.0037V11H11.0037V3.41421Z" fill="currentColor" />
                </svg>
            </span>
        </a>
    </div>
    <ul class="card-home-12-price__features">
        @@featuresHtml
    </ul>
</div>
