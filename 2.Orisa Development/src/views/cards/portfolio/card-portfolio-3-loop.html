<div class="card_case__studies-list card_case__studies card_case__studies-list--row @@classList" data-category="@@category">
    <div class="card_case__studies-card card_case__studies-card--overlay">
        <div class="card_case__studies-visual">
            <a href="@@link">
                <img src="@@img" alt="@@title">
            </a>
            <div class="card_case__studies-metric-overlay">
                <h4 class="card_case__studies-metric-value mb-0">@@metricPrefix<span class="odometer" data-count="@@metricValue"></span>%</h4>
                <span class="card_case__studies-metric-label">@@metricLabel</span>
            </div>
            <div class="card_case__studies-tags-overlay">
                @@tagsHtml
            </div>
        </div>
        <div class="card_case__studies-footer mt-10">
            <h5 class="card_case__studies-footer-title">
                <a href="@@link">@@title</a>
            </h5>
            <a href="@@link" class="card_case__studies-link text-white">
                <span class="text-white text-nowrap">View case</span>
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                </svg>
            </a>
        </div>
    </div>
</div>
