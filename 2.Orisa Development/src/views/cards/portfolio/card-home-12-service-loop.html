<a class="card-home-12-service at_fade_anim" data-fade-from="bottom" data-delay="@@delay" href="@@link" aria-label="@@title — view service">
    <div class="card-home-12-service__top">
        <div class="card-home-12-service__num-wrap">
            <span class="card-home-12-service__num-line" aria-hidden="true"></span>
            <span class="card-home-12-service__num">@@num</span>
        </div>
        <span class="card-home-12-service__icon @@iconClass" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none">
                <path d="M7 17L17 7M17 7H8M17 7V16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </span>
    </div>
    <h3 class="card-home-12-service__title">@@title</h3>
    <p class="card-home-12-service__desc">@@desc</p>
    <ul class="card-home-12-service__tags" aria-label="Service tags">
        @@tagsHtml
    </ul>
</a>
