<div class="card-home-12-process at_fade_anim" data-fade-from="bottom" data-delay="@@delay">
    <div class="card-home-12-process__image anim-zoomin-wrap">
        <img class="card-home-12-process__img anim-zoomin" src="@@img" alt="orisa" loading="lazy" decoding="async">
    </div>
    <div class="card-home-12-process__text">
        <h3 class="card-home-12-process__title">@@title</h3>
        <p class="card-home-12-process__desc">@@desc</p>
    </div>
</div>
