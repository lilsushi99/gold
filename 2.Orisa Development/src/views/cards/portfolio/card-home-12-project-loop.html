<a class="card-home-12-project" href="@@link" aria-label="@@title — view project">
    <div class="card-home-12-project__image anim-zoomin-wrap">
        <img class="card-home-12-project__img anim-zoomin" src="@@img" alt="orisa" loading="lazy" decoding="async">
    </div>
    <div class="card-home-12-project__content">
        <div class="card-home-12-project__top">
            <span class="card-home-12-project__num">@@num</span>
            <span class="card-home-12-project__dot" aria-hidden="true"></span>
            <span class="card-home-12-project__label">PROJECT</span>
        </div>
        <h3 class="card-home-12-project__title">@@title</h3>
        <p class="card-home-12-project__desc">@@desc</p>
        <ul class="card-home-12-project__tags" aria-label="Project tags">
            @@tagsHtml
        </ul>
    </div>
</a>
