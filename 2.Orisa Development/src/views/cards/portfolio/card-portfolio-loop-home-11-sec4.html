<div class="mg-portfolio-item anim-zoomin-wrap @@classList" data-category="@@category">
    <div class="mg-portfolio-thumb @@style anim-zoomin not-hide-cursor">
        <a class="cursor-hide" href="@@link">
            <img data-speed=".8" class="w-100" src="@@img" alt="@@title" />
            <span class="sec-4-home-11__thumb-title changeless" aria-hidden="true">@@thumbTitle</span>
        </a>
    </div>
    <div class="mg-portfolio-content cs-portfolio-content d-flex align-items-center flex-wrap flex-md-nowrap justify-content-between">
        <div class="w-md-75">
            <h3 class="h5 cs-portfolio-title at-title-anim fix mr-20 at-ff-sequel-semi-bold">
                <a href="@@link" class="at-title-text">@@title</a>
            </h3>
            <p class="fz-font-lg neutral-500">@@description</p>
        </div>
        <div class="cs-portfolio-tag">
            <ul class="d-flex justify-content-md-end flex-wrap text-nowrap">
                @@tagsHtml
            </ul>
        </div>
    </div>
</div>
